<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopia 路比亞 - AI 智慧二手市集</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 頂部簡潔導覽列 -->
    <nav class="bg-white sticky top-0 z-40 border-b border-gray-100 p-4 flex justify-between items-center">
        <h1 class="text-xl font-black text-emerald-600">Loopia</h1>
        <button onclick="showLoginModal()" class="text-sm font-bold text-gray-600">會員登入</button>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-6">
        <!-- Banner -->
        <div class="bg-emerald-600 rounded-2xl p-6 text-white shadow-lg">
            <h2 class="text-2xl font-bold">AI 智慧二手市集</h2>
            <p class="text-emerald-50 text-sm mt-1">輕鬆拍照，AI 幫你自動上架</p>
            <button onclick="showLoginModal()" class="mt-4 bg-white text-emerald-600 px-4 py-2 rounded-lg text-sm font-bold shadow">立即刊登商品</button>
        </div>

        <!-- 商品列表 -->
        <div id="productList" class="grid gap-4">
            <p class="text-center text-gray-400 py-10">讀取中...</p>
        </div>
    </div>

    <!-- 登入引導彈出窗 -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm text-center space-y-4">
            <h3 class="text-xl font-bold">登入後即可操作</h3>
            <p class="text-gray-500 text-sm">刊登商品或聯絡賣家，請先進行會員認證，確保交易安全。</p>
            <button class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">Google 快速登入</button>
            <button onclick="closeModal()" class="w-full text-gray-400 text-sm">取消瀏覽</button>
        </div>
    </div>

    <script>
        function showLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('loginModal').classList.add('hidden'); }

        async function loadProducts() {
            const res = await fetch('/api/products');
            const { data } = await res.json();
            document.getElementById('productList').innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-gray-900">${p.title}</h4>
                        <span class="text-emerald-600 font-bold">$${p.price}</span>
                    </div>
                    <p class="text-xs text-gray-500 line-clamp-2 mb-3">${p.description}</p>
                    <button onclick="showLoginModal()" class="w-full py-2 bg-gray-900 text-white rounded-lg text-sm font-bold">聯絡賣家</button>
                </div>
            `).join('');
        }
        loadProducts();
    </script>
</body>
</html>
