<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopia 路比亞 - AI 智慧二手市集</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans pb-12">
    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center justify-between w-full sm:w-auto">
                <a href="#" id="homeLogo" class="flex items-center gap-2 cursor-pointer">
                    <div class="bg-emerald-600 text-white font-black text-xl px-3 py-1.5 rounded-xl tracking-wider">∞</div>
                    <span class="text-xl font-extrabold text-slate-900 tracking-tight">Loopia <span class="text-emerald-700">路比亞</span></span>
                </a>
                <span class="hidden sm:inline-block bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-semibold">AI 視覺 & 全功能會員版</span>
            </div>

            <!-- 頂部搜尋列 -->
            <div class="w-full sm:max-w-md relative">
                <input type="text" id="searchInput" placeholder="搜尋全台鄉鎮市區好物、品牌..." class="w-full bg-slate-100/80 border border-slate-200 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                <span class="absolute right-3 top-2.5 text-slate-400">🔍</span>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button id="openUploadBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded-full transition shadow-xs cursor-pointer flex items-center gap-1.5">
                    ✨ AI 智慧刊登
                </button>
                <button id="authBtn" class="border border-slate-300 hover:bg-slate-100 text-slate-700 text-sm font-semibold px-4 py-2 rounded-full transition cursor-pointer">
                    登入 / 註冊
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">
        <!-- 宣傳 Banner -->
        <div class="bg-emerald-700 text-white rounded-3xl p-6 sm:p-8 flex flex-col sm:flex-row justify-between items-center gap-6 shadow-md relative overflow-hidden">
            <div class="space-y-2 z-10">
                <h2 class="text-2xl sm:text-3xl font-black tracking-tight flex items-center gap-2">
                    真實雲端 AI 視覺辨識 & 全網行情比對引擎 🌍
                </h2>
                <p class="text-emerald-100 text-sm sm:text-base leading-relaxed">
                    拍照或上傳後，AI 自動辨識物件、精準比對市集行情並自動填寫分類與細節！
                </p>
            </div>
            <button id="bannerUploadBtn" class="bg-white text-emerald-800 hover:bg-emerald-50 font-bold px-6 py-3 rounded-full transition shadow-md whitespace-nowrap cursor-pointer z-10">
                立即拍照上架 →
            </button>
        </div>

        <!-- 地區與分類篩選區 -->
        <div class="bg-white rounded-3xl p-4 sm:p-6 border border-slate-200/80 shadow-xs space-y-4">
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                <div class="flex items-center gap-2 text-sm font-bold text-slate-700">
                    <span>📍 全地區篩選：</span>
                </div>
                <div class="w-full sm:w-64">
                    <input type="text" id="regionFilterInput" placeholder="輸入鄉鎮市區或縣市篩選 (例如: 鼓山區)" class="w-full bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <!-- 分類標籤列 -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                <button class="category-btn bg-emerald-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-xs cursor-pointer transition" data-category="全部">全部商品</button>
                <button class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap cursor-pointer transition" data-category="手機與3C">📱 手機與3C</button>
                <button class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap cursor-pointer transition" data-category="家居家具">🛋️ 家居家具</button>
                <button class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap cursor-pointer transition" data-category="服飾配件">👕 服飾配件</button>
                <button class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap cursor-pointer transition" data-category="圖書文具">📚 圖書文具</button>
                <button class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap cursor-pointer transition" data-category="美妝生活">✨ 美妝生活</button>
                <button class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap cursor-pointer transition" data-category="休閒娛樂">⚽ 休閒娛樂</button>
                <button class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap cursor-pointer transition" data-category="母嬰玩具">🧸 母嬰玩具</button>
            </div>
        </div>

        <!-- 商品列表展示區 -->
        <section>
            <div class="flex justify-between items-center mb-4 px-2">
                <h3 class="text-lg font-bold text-slate-900">🔥 熱門精選好物</h3>
                <span id="productCount" class="text-xs text-slate-400 font-medium">載入中...</span>
            </div>
            <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <p class="text-slate-400 text-sm col-span-full text-center py-12">正在載入商品列表...</p>
            </div>
        </section>
    </main>

    <!-- AI 智慧刊登彈窗 -->
    <div id="uploadModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4 my-8">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">📸 AI 智慧上架</h3>
                <button id="closeUploadModal" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2 cursor-pointer">&times;</button>
            </div>

            <form id="uploadForm" class="space-y-4 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">上傳照片或直接使用相機拍照</label>
                    <!-- 加上 capture="environment" 支援手機直接開啟後鏡頭拍照 -->
                    <input type="file" id="imageInput" accept="image/*" capture="environment" required class="block w-full text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">商品分類 (AI 自動判斷)</label>
                        <select id="itemCategory" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="手機與3C">手機與3C</option>
                            <option value="家居家具">家居家具</option>
                            <option value="服飾配件">服飾配件</option>
                            <option value="圖書文具">圖書文具</option>
                            <option value="美妝生活">美妝生活</option>
                            <option value="休閒娛樂">休閒娛樂</option>
                            <option value="母嬰玩具">母嬰玩具</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">商品狀態</label>
                        <select id="itemCondition" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="全新未拆封">全新未拆封</option>
                            <option value="幾乎全新">幾乎全新</option>
                            <option value="輕微使用痕跡">輕微使用痕跡</option>
                            <option value="有明顯使用痕跡">有明顯使用痕跡</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1">刊登地區 (自動精確定位至鄉鎮市區)</label>
                    <div class="flex gap-2">
                        <input type="text" id="itemRegion" placeholder="例如：高雄市鼓山區" required class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <button type="button" id="autoGeoBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl whitespace-nowrap cursor-pointer font-medium">📍 重新定位</button>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1">補充商品內容 / 瑕疵說明 (可選)</label>
                    <textarea id="extraDescription" rows="2" placeholder="在此補充 AI 未提到的細節、面交地點或購買年份等..." class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1">聯絡方式 (LINE ID / 電話)</label>
                    <input type="text" id="sellerContact" placeholder="例如：line_id123 或 0912345678" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md cursor-pointer">
                    ✨ 確認送出，讓 AI 生成文案並上架
                </button>
            </form>

            <div id="loading" class="hidden text-center text-xs text-emerald-600 font-bold animate-pulse py-2">
                🤖 AI 正在辨識物件、精確比對行情並生成文案中，請稍候約 5 秒...
            </div>
        </div>
    </div>

    <!-- 登入 / 註冊彈窗 -->
    <div id="authModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="authTitle" class="text-lg font-bold text-slate-900">👤 會員登入</h3>
                <button id="closeAuthModal" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2 cursor-pointer">&times;</button>
            </div>
            
            <div id="authViewLogin" class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">電子郵件</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">密碼</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <button id="actionLoginBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl transition cursor-pointer">登入帳號</button>
                <p class="text-center text-xs text-slate-500 pt-2">還沒有帳號？ <button type="button" id="switchToRegister" class="text-emerald-600 font-bold hover:underline cursor-pointer">立即註冊</button></p>
            </div>

            <div id="authViewRegister" class="hidden space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">設定電子郵件</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">設定密碼</label>
                    <input type="password" id="regPassword" placeholder="至少 6 位數密碼" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <button id="actionRegisterBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition cursor-pointer">註冊新會員</button>
                <p class="text-center text-xs text-slate-500 pt-2">已經有帳號了？ <button type="button" id="switchToLogin" class="text-emerald-600 font-bold hover:underline cursor-pointer">返回登入</button></p>
            </div>
        </div>
    </div>

    <!-- 用戶端互動 JavaScript -->
    <script>
        const homeLogo = document.getElementById('homeLogo');
        const openUploadBtn = document.getElementById('openUploadBtn');
        const bannerUploadBtn = document.getElementById('bannerUploadBtn');
        const uploadModal = document.getElementById('uploadModal');
        const closeUploadModal = document.getElementById('closeUploadModal');
        
        const authBtn = document.getElementById('authBtn');
        const authModal = document.getElementById('authModal');
        const closeAuthModal = document.getElementById('closeAuthModal');
        const switchToRegister = document.getElementById('switchToRegister');
        const switchToLogin = document.getElementById('switchToLogin');
        const authViewLogin = document.getElementById('authViewLogin');
        const authViewRegister = document.getElementById('authViewRegister');
        const authTitle = document.getElementById('authTitle');

        const uploadForm = document.getElementById('uploadForm');
        const imageInput = document.getElementById('imageInput');
        const itemCategory = document.getElementById('itemCategory');
        const itemCondition = document.getElementById('itemCondition');
        const itemRegion = document.getElementById('itemRegion');
        const extraDescription = document.getElementById('extraDescription');
        const sellerContact = document.getElementById('sellerContact');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        
        const productList = document.getElementById('productList');
        const productCount = document.getElementById('productCount');
        const regionFilterInput = document.getElementById('regionFilterInput');
        const searchInput = document.getElementById('searchInput');
        const autoGeoBtn = document.getElementById('autoGeoBtn');
        const categoryBtns = document.querySelectorAll('.category-btn');

        let allProducts = [];
        let currentCategory = '全部';

        // 彈窗開關控制
        openUploadBtn.addEventListener('click', () => {
            uploadModal.classList.remove('hidden');
            autoDetectLocation();
        });
        bannerUploadBtn.addEventListener('click', () => {
            uploadModal.classList.remove('hidden');
            autoDetectLocation();
        });
        closeUploadModal.addEventListener('click', () => uploadModal.classList.add('hidden'));

        authBtn.addEventListener('click', () => authModal.classList.remove('hidden'));
        closeAuthModal.addEventListener('click', () => authModal.classList.add('hidden'));

        switchToRegister.addEventListener('click', () => {
            authViewLogin.classList.add('hidden');
            authViewRegister.classList.remove('hidden');
            authTitle.textContent = '👤 會員註冊';
        });
        switchToLogin.addEventListener('click', () => {
            authViewRegister.classList.add('hidden');
            authViewLogin.classList.remove('hidden');
            authTitle.textContent = '👤 會員登入';
        });

        homeLogo.addEventListener('click', (e) => {
            e.preventDefault();
            regionFilterInput.value = '';
            searchInput.value = '';
            currentCategory = '全部';
            updateCategoryUI('全部');
            renderProducts(allProducts);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 自動定位（精確至鄉鎮市區）
        async function autoDetectLocation() {
            if (!navigator.geolocation) {
                itemRegion.value = '高雄市鼓山區';
                return;
            }
            autoGeoBtn.textContent = '定位中...';
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`);
                    const data = await res.json();
                    if (data && data.address) {
                        const city = data.address.city || data.address.county || data.address.state || '高雄市';
                        const district = data.address.town || data.address.suburb || data.address.district || data.address.village || '鼓山區';
                        itemRegion.value = `${city}${district}`;
                    } else {
                        itemRegion.value = '高雄市鼓山區';
                    }
                } catch (e) {
                    itemRegion.value = '高雄市鼓山區';
                }
                autoGeoBtn.textContent = '📍 重新定位';
            }, () => {
                itemRegion.value = '高雄市鼓山區';
                autoGeoBtn.textContent = '📍 重新定位';
            });
        }

        autoGeoBtn.addEventListener('click', autoDetectLocation);

        // 分類點擊切換
        categoryBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentCategory = btn.getAttribute('data-category');
                updateCategoryUI(currentCategory);
                renderProducts(allProducts);
            });
        });

        function updateCategoryUI(catName) {
            categoryBtns.forEach(b => {
                if (b.getAttribute('data-category') === catName) {
                    b.classList.remove('bg-slate-100', 'text-slate-700', 'font-medium');
                    b.classList.add('bg-emerald-600', 'text-white', 'font-bold');
                } else {
                    b.classList.remove('bg-emerald-600', 'text-white', 'font-bold');
                    b.classList.add('bg-slate-100', 'text-slate-700', 'font-medium');
                }
            });
        }

        function convertBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // 渲染商品列表
        function renderProducts(products) {
            const regionKeyword = regionFilterInput.value.trim().toLowerCase();
            const keyword = searchInput.value.trim().toLowerCase();

            let filtered = products.filter(p => {
                const matchRegion = !regionKeyword || (p.region && p.region.toLowerCase().includes(regionKeyword));
                const matchCategory = (currentCategory === '全部' || p.category === currentCategory);
                const matchKeyword = !keyword || (p.title && p.title.toLowerCase().includes(keyword)) || (p.description && p.description.toLowerCase().includes(keyword)) || (p.region && p.region.toLowerCase().includes(keyword));
                return matchRegion && matchCategory && matchKeyword;
            });

            productCount.textContent = `共 ${filtered.length} 件商品`;

            if (filtered.length > 0) {
                productList.innerHTML = filtered.map(p => `
                    <div class="bg-white rounded-3xl shadow-xs border border-slate-200/80 p-4 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="flex justify-between items-start mb-2 gap-2">
                                <h4 class="font-bold text-base text-slate-900 line-clamp-1">${p.title}</h4>
                                <span class="bg-emerald-50 text-emerald-700 text-xs px-2 py-0.5 rounded-lg font-semibold whitespace-nowrap">${p.region || '全台'}</span>
                            </div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">${p.category || '其他'}</span>
                                <span class="text-xs bg-amber-50 text-amber-700 px-2 py-0.5 rounded font-medium">${p.condition_status || '九成新'}</span>
                            </div>
                            <p class="text-emerald-700 font-extrabold text-lg mb-2">NT$ ${p.price}</p>
                            <p class="text-slate-600 text-xs mb-4 line-clamp-3 leading-relaxed">${p.description}</p>
                        </div>
                        <div class="border-t border-slate-100 pt-3 flex justify-between items-center text-xs text-slate-500">
                            <span class="truncate max-w-[120px]">聯絡：${p.seller_contact}</span>
                            <div class="flex items-center gap-2">
                                <span class="text-slate-400">${new Date(p.created_at).toLocaleDateString()}</span>
                                <button onclick="deleteProduct('${p.id}')" class="text-rose-400 hover:text-rose-600 font-medium px-1.5 py-0.5 rounded cursor-pointer transition">下架</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                productList.innerHTML = '<p class="text-slate-400 text-sm col-span-full text-center py-12">找不到符合條件的二手好物，趕快來上架第一件吧！</p>';
            }
        }

        regionFilterInput.addEventListener('input', () => renderProducts(allProducts));
        searchInput.addEventListener('input', () => renderProducts(allProducts));

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                const result = await res.json();
                if (result.success) {
                    allProducts = result.data;
                    renderProducts(allProducts);
                } else {
                    productList.innerHTML = '<p class="text-slate-400 text-sm col-span-full text-center py-12">目前沒有任何商品</p>';
                }
            } catch (e) {
                productList.innerHTML = '<p class="text-red-400 text-sm col-span-full text-center py-12">無法載入商品列表</p>';
            }
        }

        async function deleteProduct(id) {
            if (!confirm('確定要將這件商品從市集下架嗎？')) return;
            try {
                const res = await fetch(`/api/delete-product?id=${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.success) {
                    alert('已成功下架！');
                    fetchProducts();
                } else {
                    alert('下架失敗：' + result.error);
                }
            } catch (err) {
                alert('發生錯誤：' + err.message);
            }
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = imageInput.files[0];
            const category = itemCategory.value;
            const condition_status = itemCondition.value;
            const region = itemRegion.value;
            const extra = extraDescription.value;
            const contact = sellerContact.value;

            if (!file) return alert('請選擇或拍攝圖片');

            submitBtn.disabled = true;
            loading.classList.remove('hidden');

            try {
                const imageBase64 = await convertBase64(file);
                const res = await fetch('/api/create-product', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64, category, condition_status, region, extraDescription: extra, sellerContact: contact })
                });

                const textResult = await res.text();
                let result;
                try {
                    result = JSON.parse(textResult);
                } catch (err) {
                    throw new Error('伺服器回傳格式錯誤（請確認 Vercel API 路由設定）：' + textResult.substring(0, 100));
                }

                if (result.success) {
                    alert('上架成功！AI 已自動生成行情文案與分類。');
                    uploadForm.reset();
                    uploadModal.classList.add('hidden');
                    fetchProducts();
                } else {
                    alert('上架失敗：' + result.error);
                }
            } catch (err) {
                alert('發生錯誤：' + err.message);
            } finally {
                submitBtn.disabled = false;
                loading.classList.add('hidden');
            }
        });

        fetchProducts();
    </script>
</body>
</html>
