<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loopia 路比亞 - AI 智慧二手市集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 台灣縣市與鄉鎮區對照表
        const taiwanDistricts = {
            "台北市": ["中正區", "大同區", "中山區", "松山區", "大安區", "萬華區", "信義區", "士林區", "北投區", "內湖區", "南港區", "文山區"],
            "高雄市": ["鹽埕區", "鼓山區", "左營區", "楠梓區", "三民區", "前金區", "新興區", "前鎮區", "旗津區", "小港區", "鳳山區", "林園區", "大寮區", "大樹區", "大社區", "仁武區", "鳥松區", "岡山區", "橋頭區", "燕巢區", "田寮區", "阿蓮區", "路竹區", "湖內區", "茄萣區", "永安區", "彌陀區", "梓官區", "旗山區", "美濃區", "六龜區", "甲仙區", "杉林區", "內門區", "茂林區", "桃源區", "那瑪夏區"],
            "台中市": ["中區", "東區", "南區", "西區", "北區", "西屯區", "南屯區", "北屯區", "豐原區", "大里區", "太平區", "清水區", "沙鹿區", "梧棲區", "后里區", "神岡區", "潭子區", "大雅區", "新社區", "石岡區", "東勢區", "和平區", "新社區", "大肚區", "沙鹿區", "龍井區", "沙鹿區", "霧峰區", "烏日區", "大甲區", "外埔區", "大安區"],
            "新北市": ["板橋區", "三重區", "中和區", "永和區", "新莊區", "新店區", "樹林區", "鶯歌區", "三峽區", "淡水區", "汐止區", "瑞芳區", "土城區", "蘆洲區", "五股區", "泰山區", "林口區", "深坑區", "石碇區", "坪林區", "三芝區", "石門區", "八里區", "平溪區", "雙溪區", "貢寮區", "金山區", "萬里區", "烏來區"],
            "台南市": ["中西區", "東區", "南區", "北區", "安平區", "安南區", "永康區", "歸仁區", "新化區", "左鎮區", "玉井區", "楠西區", "南化區", "仁德區", "關廟區", "龍崎區", "官田區", "麻豆區", "佳里區", "西港區", "七股區", "將軍區", "北門區", "新營區", "後壁區", "白河區", "東山區", "六甲區", "下營區", "柳營區", "鹽水區", "善化區", "大內區", "安定區", "山上區", "安定區"],
            "桃園市": ["桃園區", "中壢區", "平鎮區", "八德區", "楊梅區", "蘆竹區", "大溪區", "龍潭區", "龜山區", "大園區", "觀音區", "新屋區", "復興區"]
        };

        function updateDistricts(selectId, districtSelectId) {
            const city = document.getElementById(selectId).value;
            const districtSelect = document.getElementById(districtSelectId);
            districtSelect.innerHTML = '<option value="">全區 / 鄉鎮</option>';
            if (taiwanDistricts[city]) {
                taiwanDistricts[city].forEach(d => {
                    districtSelect.innerHTML += `<option value="${d}">${d}</option>`;
                });
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b sticky top-0 z-40 px-4 py-3 shadow-xs">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- 點擊 Logo 回首頁 -->
            <a href="#" onclick="location.reload(); return false;" class="flex items-center gap-2 cursor-pointer">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-black text-xl">∞</div>
                <div>
                    <h1 class="text-lg font-black text-slate-900 leading-tight">Loopia 路比亞</h1>
                    <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">AI 視覺 & 全功能會員版</span>
                </div>
            </a>

            <!-- 搜尋欄 -->
            <div class="w-full md:w-96 relative">
                <input type="text" id="searchInput" placeholder="搜尋全台鄉鎮市區好物、品牌..." class="w-full bg-slate-100 pl-4 pr-10 py-2.5 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button class="absolute right-3 top-2.5 text-slate-400">🔍</button>
            </div>

            <!-- 功能按鈕 -->
            <div class="flex items-center gap-3">
                <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-full text-sm font-bold flex items-center gap-1.5 shadow-sm transition">
                    ✨ AI 智慧刊登
                </button>
                <button onclick="alert('會員中心功能開發中')" class="border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded-full text-sm font-bold text-slate-700 transition">
                    登入 / 註冊
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6">
        <!-- Banner 區塊 -->
        <div class="bg-emerald-700 text-white rounded-3xl p-6 md:p-8 flex flex-col md:flex-row justify-between items-center shadow-lg relative overflow-hidden">
            <div class="space-y-2 z-10">
                <h2 class="text-2xl md:text-3xl font-black">真實雲端 AI 視覺辨識 & 全網路行情比對引擎 🌍</h2>
                <p class="text-emerald-100 text-sm max-w-xl">拍照後透過後端 AI 模型辨識物件並自動比對網路二手市場售價；完整會員中心支援密碼修改與設定！</p>
            </div>
            <button onclick="openModal()" class="mt-4 md:mt-0 bg-white text-emerald-800 hover:bg-emerald-50 font-bold px-6 py-3 rounded-2xl shadow transition whitespace-nowrap z-10 flex items-center gap-2">
                立即拍照上架 ➔
            </button>
        </div>

        <!-- 篩選列 (全台地區與分類) -->
        <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100 space-y-4">
            <div class="flex flex-wrap items-center gap-2 text-sm">
                <span class="text-slate-500 font-semibold flex items-center gap-1">📍 全台地區篩選：</span>
                <select id="filterCity" onchange="updateDistricts('filterCity', 'filterDistrict'); filterProducts();" class="border border-slate-200 rounded-lg px-3 py-1.5 text-slate-700">
                    <option value="">全台灣 (所有縣市)</option>
                    <option value="台北市">台北市</option>
                    <option value="高雄市">高雄市</option>
                    <option value="台中市">台中市</option>
                    <option value="新北市">新北市</option>
                    <option value="台南市">台南市</option>
                    <option value="桃園市">桃園市</option>
                </select>
                <select id="filterDistrict" onchange="filterProducts()" class="border border-slate-200 rounded-lg px-3 py-1.5 text-slate-700">
                    <option value="">全區 / 鄉鎮</option>
                </select>
            </div>

            <!-- 分類標籤 -->
            <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
                <button onclick="selectCategory('全部', this)" class="category-btn bg-emerald-600 text-white px-4 py-1.5 rounded-full text-xs font-bold transition">全部商品</button>
                <button onclick="selectCategory('電子產品', this)" class="category-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-1.5 rounded-full text-xs font-bold transition">📱 手機與3C</button>
                <button onclick="selectCategory('家居', this)" class="category-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-1.5 rounded-full text-xs font-bold transition">🛋️ 家居家具</button>
                <button onclick="selectCategory('書籍', this)" class="category-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-1.5 rounded-full text-xs font-bold transition">📚 圖書文具</button>
                <button onclick="selectCategory('其他', this)" class="category-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-1.5 rounded-full text-xs font-bold transition">📦 其他好物</button>
            </div>
        </div>

        <!-- 商品展示牆 -->
        <div id="productList" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-12 text-slate-400">正在載入商品...</div>
        </div>
    </main>

    <!-- AI 智慧刊登彈跳視窗 -->
    <div id="productModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-900">✨ AI 智慧拍照與刊登</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
            </div>
            
            <form id="productForm" onsubmit="submitProduct(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold mb-1 text-slate-700">拍照 / 上傳商品照片 (AI 自動辨識)</label>
                    <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewImage(event)" required class="w-full border border-slate-200 p-2 rounded-xl text-xs">
                    <div id="imagePreviewContainer" class="mt-2 hidden">
                        <img id="imagePreview" class="w-full h-40 object-cover rounded-xl border">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold mb-1 text-slate-700">商品分類 (AI 自動判定)</label>
                        <select id="modalCategory" class="w-full border border-slate-200 p-2.5 rounded-xl bg-slate-50 font-bold text-emerald-700">
                            <option value="電子產品">📱 電子產品</option>
                            <option value="家居">🛋️ 家居</option>
                            <option value="書籍">📚 書籍</option>
                            <option value="其他">📦 其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-slate-700">新舊狀態</label>
                        <select id="modalCondition" class="w-full border border-slate-200 p-2.5 rounded-xl">
                            <option value="全新">✨ 全新</option>
                            <option value="幾乎全新">💎 幾乎全新</option>
                            <option value="九成新">⭐ 九成新</option>
                            <option value="輕微使用痕跡">🟢 輕微使用痕跡</option>
                            <option value="明顯使用痕跡">🟡明顯使用痕跡</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold mb-1 text-slate-700">縣市 (自動定位)</label>
                        <select id="modalCity" onchange="updateDistricts('modalCity', 'modalDistrict')" class="w-full border border-slate-200 p-2.5 rounded-xl">
                            <option value="台北市">台北市</option>
                            <option value="高雄市" selected>高雄市</option>
                            <option value="台中市">台中市</option>
                            <option value="新北市">新北市</option>
                            <option value="台南市">台南市</option>
                            <option value="桃園市">桃園市</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-slate-700">鄉鎮區</label>
                        <select id="modalDistrict" class="w-full border border-slate-200 p-2.5 rounded-xl">
                            <option value="鼓山區">鼓山區</option>
                            <option value="左營區">左營區</option>
                            <option value="前鎮區">前鎮區</option>
                            <option value="三民區">三民區</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-bold mb-1 text-slate-700">賣家聯絡 Email</label>
                    <input type="email" id="modalContact" placeholder="your@email.com" required class="w-full border border-slate-200 p-2.5 rounded-xl">
                </div>

                <div>
                    <label class="block font-bold mb-1 text-slate-700">補充說明 (選填)</label>
                    <textarea id="modalDesc" placeholder="例如：功能正常，附原廠充電線..." class="w-full border border-slate-200 p-2.5 rounded-xl h-20"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow transition">
                    🚀 確認送出 AI 智慧上架
                </button>
            </form>
        </div>
    </div>

    <script>
        let allProducts = [];
        let currentCategory = '全部';

        function openModal() {
            document.getElementById('productModal').classList.remove('hidden');
            autoDetectLocation(); // 開啟時自動定位
        }
        function closeModal() { document.getElementById('productModal').classList.add('hidden'); }

        // 自動定位功能
        function autoDetectLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    // 簡單示範：若在台灣南部預設高雄，也可以依據經緯度精準對應
                    document.getElementById('modalCity').value = '高雄市';
                    updateDistricts('modalCity', 'modalDistrict');
                    document.getElementById('modalDistrict').value = '鼓山區';
                }, () => {
                    console.log('無法取得定位，使用預設值');
                });
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    
                    // 模擬 AI 快速判斷分類 (可根據檔名或直接預設電子產品)
                    document.getElementById('modalCategory').value = '電子產品';
                }
                reader.readAsDataURL(file);
            }
        }

        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const result = await res.json();
                allProducts = result.data || [];
                renderProducts(allProducts);
            } catch (err) {
                document.getElementById('productList').innerHTML = '<p class="col-span-full text-center text-red-400">載入商品失敗</p>';
            }
        }

        function selectCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(b => {
                b.className = 'category-btn bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-1.5 rounded-full text-xs font-bold transition';
            });
            btn.className = 'category-btn bg-emerald-600 text-white px-4 py-1.5 rounded-full text-xs font-bold transition';
            filterProducts();
        }

        function filterProducts() {
            const city = document.getElementById('filterCity').value;
            const district = document.getElementById('filterDistrict').value;
            const keyword = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allProducts.filter(p => {
                const matchCat = (currentCategory === '全部' || p.category === currentCategory);
                const matchCity = (!city || p.region?.includes(city));
                const matchDist = (!district || p.region?.includes(district));
                const matchKeyword = (!keyword || p.title.toLowerCase().includes(keyword) || p.description.toLowerCase().includes(keyword));
                return matchCat && matchCity && matchDist && matchKeyword;
            });

            renderProducts(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterProducts);

        function renderProducts(products) {
            const list = document.getElementById('productList');
            if (products.length === 0) {
                list.innerHTML = '<p class="col-span-full text-center py-12 text-slate-400">沒有找到符合條件的商品</p>';
                return;
            }

            // 加上狀態 Emoji 對應
            const conditionEmoji = {
                "全新": "✨",
                "幾乎全新": "💎",
                "九成新": "⭐",
                "輕微使用痕跡": "🟢",
                "明顯使用痕跡": "🟡"
            };

            list.innerHTML = products.map(p => {
                const emoji = conditionEmoji[p.condition_status] || "📦";
                return `
                    <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-100 flex flex-col justify-between space-y-3 hover:shadow-md transition">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-slate-900 text-base">${p.title}</h3>
                                <span class="text-emerald-600 font-extrabold text-lg">$${p.price}</span>
                            </div>
                            <p class="text-xs text-slate-500 line-clamp-2 mt-1">${p.description}</p>
                        </div>
                        <div class="space-y-2">
                            <div class="flex flex-wrap gap-1.5 text-[11px] text-slate-500">
                                <span class="bg-slate-100 px-2 py-0.5 rounded-md">📂 ${p.category}</span>
                                <span class="bg-slate-100 px-2 py-0.5 rounded-md">${emoji} ${p.condition_status || '新舊不明'}</span>
                                <span class="bg-slate-100 px-2 py-0.5 rounded-md">📍 ${p.region || '未指定地區'}</span>
                            </div>
                            <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                                <span class="text-slate-400">${new Date(p.created_at).toLocaleDateString()}</span>
                                <a href="mailto:${p.seller_contact}" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-xl font-semibold transition">聯絡賣家</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function submitProduct(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = '🤖 AI 正在辨識影像與比對行情中...';
            btn.disabled = true;

            const file = document.getElementById('imageInput').files[0];
            const reader = new FileReader();

            reader.onload = async function() {
                try {
                    const city = document.getElementById('modalCity').value;
                    const district = document.getElementById('modalDistrict').value;
                    
                    const res = await fetch('/api/create-product', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            imageBase64: reader.result,
                            category: document.getElementById('modalCategory').value,
                            condition_status: document.getElementById('modalCondition').value,
                            region: `${city}${district}`,
                            extraDescription: document.getElementById('modalDesc').value,
                            sellerContact: document.getElementById('modalContact').value
                        })
                    });

                    const result = await res.json();
                    if (result.success) {
                        alert('✨ AI 辨識成功！商品已順利上架！');
                        closeModal();
                        document.getElementById('productForm').reset();
                        document.getElementById('imagePreviewContainer').classList.add('hidden');
                        loadProducts();
                    } else {
                        alert('上架失敗: ' + (result.error || '未知錯誤'));
                    }
                } catch (err) {
                    alert('發生連線錯誤');
                } finally {
                    btn.innerText = '🚀 確認送出 AI 智慧上架';
                    btn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        }

        loadProducts();
    </script>
</body>
</html>
